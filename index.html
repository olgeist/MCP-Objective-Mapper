<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Extension Testkit</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 800px; margin: 2rem auto; }
        .container { background: #f4f4f5; padding: 1.5rem; border-radius: 8px; margin-bottom: 1rem; }
        button, .btn, [role="button"], input[type="button"] { padding: 8px 12px; margin: 4px; cursor: pointer; }
        #console-log { background: #1e293b; color: #34d399; padding: 1rem; height: 200px; overflow-y: auto; font-family: monospace; border-radius: 8px; }
    </style>
</head>
<body>
    <h1>Auto Button Testkit</h1>
    <div class="container">
        <button data-test-name="Primary Action">Primary</button>
        <div role="button" tabindex="0" data-test-name="Custom Div">Custom Div Button</div>
        <input type="button" value="Input Button">
    </div>
    <h2>Action Log</h2>
    <div id="console-log"></div>
    
    <script src="testkit.js"></script>
</body>
</html>
